version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Azure mode - set to 'true' to use Azure services, 'false' for local
      - AZURE_MODE=${AZURE_MODE:-false}
      # Local services (used when AZURE_MODE=false)
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - rag-network
    restart: unless-stopped

  # Qdrant vector database (used in local mode, AZURE_MODE=false)
  # When using Azure AI Search (AZURE_MODE=true), you can comment this out
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rag-network
    restart: unless-stopped
    # Uncomment to disable when using Azure mode
    # profiles:
    #   - local

  # Redis cache (used in both local and Azure modes)
  # In production, point to Azure Cache for Redis via REDIS_URL
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge
